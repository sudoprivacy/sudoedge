name: appliance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deployment-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve shared deploy source pin
        id: stack
        run: python -c "import json,os; x=json.load(open('scripts/sudostack.lock.json')); open(os.environ['GITHUB_OUTPUT'],'a').write('commit='+x['commit']+'\n')"
      - uses: actions/checkout@v4
        with:
          repository: sudoprivacy/sudostack
          ref: ${{ steps.stack.outputs.commit }}
          path: .shared/sudostack
      - name: Router provisioning and catalog preservation
        run: python tests/router-config.py
      - name: Model limits and client configuration
        run: python tests/model-config.py
      - name: Cohost installation verifies actual process bytes
        run: python tests/cohost-install.py
        env:
          SUDOSTACK_DEPLOY_ROOT: ${{ github.workspace }}/.shared/sudostack
      - name: Deployment shell syntax
        run: find scripts tests -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Install network tools
        run: sudo apt-get update && sudo apt-get install -y nftables iproute2
      - name: Actual connectivity policy in an isolated network namespace
        run: sudo bash tests/connectivity.sh

  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows tunnel and installation scripts
        shell: pwsh
        run: |
          foreach ($script in Get-ChildItem scripts -Filter *.ps1) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
