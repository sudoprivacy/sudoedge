# sudoedge — the container stack for an edge GPU box.
#   gpustack   — local GPU inference (spawns the vLLM runner as a sibling container)
#   sudorouter — nova-gateway, the local OpenAI-compatible router
#
# Deploy order:
#   1. scripts/build-nova-gateway.sh   → builds sudorouter:latest
#   2. scripts/bootstrap.sh            → host guardrails + compose/.env (TEE_KEY)
#   3. docker compose up -d
#   4. scripts/configure.sh            → channels, relay token, sudocode wiring
name: sudoedge

services:
  gpustack:
    image: quay.io/gpustack/gpustack:latest      # pin a digest for a real release
    restart: unless-stopped
    ports:
      - "80:80"
    command: ["--system-default-container-registry", "quay.io"]
    volumes:
      - gpustack-data:/var/lib/gpustack           # model weights cache — persists on disk
      - /var/run/docker.sock:/var/run/docker.sock # gpustack launches the vLLM runner as a sibling

  sudorouter:
    image: sudorouter:latest                       # built from the nova-gateway repo by scripts/build-nova-gateway.sh
    restart: always
    network_mode: host                             # serves :3000; reaches gpustack at 127.0.0.1:80
    environment:
      GENERATE_DEFAULT_TOKEN: "true"
      TZ: Asia/Shanghai
      ERROR_LOG_ENABLED: "true"
      TEE_ADDR: ""
      TEE_KEY: "${TEE_KEY:?missing compose/.env — run scripts/bootstrap.sh}"
      TEE_UID: "0"
    tmpfs:
      - /data                                      # RAM-backed: no credential is written to the box's disk
    depends_on:
      - gpustack

volumes:
  gpustack-data:
